security:
    # 🔐 Password encoding configuration
    password_hashers:
        App\Entity\User:
            algorithm: auto

    # 👤 Define where Symfony loads users from (your User entity)
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    # 🔥 Define firewall rules (login zones)
    firewalls:
        # Disable security for dev assets
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: app_user_provider

            # 👇 **Fix for the error**
            entry_point: form_login

            # ✅ Enable login form
            form_login:
                login_path: login
                check_path: login
                enable_csrf: true
                default_target_path: /

            # Optional: remember-me feature
            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800 # 7 days
                path: /
                always_remember_me: true

            # 👇 Your authenticator created by make:auth
            custom_authenticator: App\Security\UserAuthenticator

            # ✅ Enable logout
            logout:
                path: logout
                target: /

    # 🎯 Restrict routes by roles
    access_control:
        - { path: ^/addvoiture, roles: ROLE_AGENT }
        # - { path: ^/booking, roles: ROLE_USER }
        # - { path: ^/profile, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            App\Entity\User:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10
